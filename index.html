<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>브이월드 3D 지도 - CSV 좌표 이동</title>
    <link rel="stylesheet" href="css/style.css" />
    <script type="text/javascript" src="js/config.js"></script>
    <script type="text/javascript">
      (function () {
        var domain = (typeof VWORLD_DOMAIN !== 'undefined' && VWORLD_DOMAIN) ? VWORLD_DOMAIN : location.host;
        var url = 'https://map.vworld.kr/js/webglMapInit.js.do?version=3.0&apiKey=' +
                  (typeof VWORLD_API_KEY !== 'undefined' ? encodeURIComponent(VWORLD_API_KEY) : '') +
                  '&domain=' + encodeURIComponent(domain);
        document.write('<script src="' + url + '"><\/script>');
      })();
    </script>
    <script type="text/javascript" src="js/csv.js"></script>
    <script type="text/javascript" src="js/beampattern.js?v=3"></script>
    <script type="text/javascript" src="js/main.js?v=3"></script>
</head>
<body>
    <div id="map"></div>

    <div id="panel">
        <div class="panel-head">
            <h1>3D 지도 좌표 이동</h1>
            <p class="hint">VWORLD 3D · CSV 업로드 후 좌표 이동</p>
        </div>

        <div class="upload-area">
            <label for="file-input" id="file-label">📂 CSV 파일 선택</label>
            <input type="file" id="file-input" accept=".csv,text/csv,text/plain" style="display:none;" />
            <p class="hint">또는 지도 영역에 CSV 파일을 드래그 &amp; 드롭하세요</p>
        </div>

        <div class="tx-section">
            <div class="section-title">📡 기지국 (송신원)</div>
            <div class="tx-row">
                <input type="text" id="tx-lon" placeholder="경도" class="tx-inp" />
                <input type="text" id="tx-lat" placeholder="위도" class="tx-inp" />
            </div>
            <div class="tx-row">
                <input type="text" id="tx-alt" placeholder="고도(m, 선택)" class="tx-inp" />
</div>
            <button id="btn-tx-apply" class="tx-btn">기지국 설정</button>
        </div>
        <div class="pred-section">
            <div class="section-title">🔮 예측 구간</div>
            <div class="tx-row">
                <input type="text" id="pred-spacing" value="50" class="tx-inp" style="width:80px;" />
                <span class="tx-label">격자 간격(m)</span>
            </div>
            <button id="btn-predict" class="tx-btn">📡 예측 구간 그리기</button>
            <div class="tx-row" style="margin-top:6px;">
                <span class="tx-label">예측 고도</span>
                <select id="pred-alt" class="tx-inp" style="flex:1; width:auto;">
                    <option value="">기지국 고도 사용</option>
                    <option value="100">100m</option>
                    <option value="200">200m</option>
                    <option value="300">300m</option>
                </select>
            </div>
            <button id="btn-alt-compare" class="tx-btn">📊 고도별 예측 비교 (100/200/300m)</button>
            <div id="alt-compare-result"></div>
        </div>
        <div class="beam-section">
            <div class="section-title">📶 안테나 빔패턴 (900MHz 옴니)</div>
            <div class="tx-row">
                <button id="btn-beam" class="tx-btn">빔패턴 표시</button>
                <input type="range" id="beam-scale" min="50" max="2000" step="50" value="500" />
                <span id="beam-scale-val" class="tx-label">500m</span>
            </div>
            <div class="tx-row">
                <input type="number" id="beam-tilt" value="0" min="-10" max="30" step="0.5" class="tx-inp" style="width:70px;" />
                <span class="tx-label">틸트(°)</span>
                <input type="number" id="beam-swing" value="0" min="0" max="360" step="1" class="tx-inp" style="width:70px;" />
                <span class="tx-label">스윙(°)</span>
            </div>
            <label class="hint beam-calib-label">
                <input type="checkbox" id="chk-beam-calib" checked />
                측정 결과 기반 보정 (예측에 안테나 이득 반영)
            </label>
            <p class="hint">틸트: 다운틸트(양수) · 스윙: 틸트 기울기 방위(북=0°). 옴니는 수평 무지향이라 스윙은 틸트&gt;0일 때 방향을 정의</p>
        </div>
        <div class="meta">
            <div id="meta-count">포인트 수: 0</div>
            <div id="meta-base">첫 행 고도(보정 기준): -</div>
        </div>

        <div class="nav-buttons">
            <button id="btn-first" title="첫 좌표">⏮</button>
            <button id="btn-prev" title="이전">◀</button>
            <button id="btn-next" title="다음">▶</button>
            <button id="btn-last" title="마지막 좌표">⏭</button>
            <button id="btn-home" title="초기 보기">⌂</button>
            <button id="btn-measure" title="두 점 거리 측정">📏</button>
            <button id="btn-clear-measure" title="측정 초기화">✕</button>
        </div>

        <div class="list-wrap">
            <div id="point-list"></div>
        </div>
    </div>

    <div id="legend"></div>
    <div id="measure-result" style="display:none"></div>
    <div id="status" class="status">브이월드 3D 지도를 불러오는 중...</div>
</body>
</html>
